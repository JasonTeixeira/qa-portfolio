name: agency-proof

# Runs the agency release gate (scripts/agency/run-proof-gates.mjs) and commits
# the resulting proof/site-proof.json back to the branch. This is what makes
# the GateRunner caption literally true: seeded at build, written by CI.

on:
  push:
    branches: [main, feat/agency-proof-portfolio]
    paths:
      - 'app/agency/**'
      - 'components/agency/**'
      - 'data/agency/**'
      - 'proof/**'
      - 'proxy.ts'
      - 'app/layout.tsx'
      - 'scripts/agency/**'

concurrency:
  group: agency-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      - name: Run proof gates
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          node scripts/agency/run-proof-gates.mjs

      # Commit the proof back even when gates fail — the site renders whatever
      # CI actually measured. [skip ci] guards against retrigger loops (the
      # paths filter on proof/** would otherwise re-run this workflow).
      - name: Commit proof back
        if: always()
        run: |
          if git diff --quiet -- proof/site-proof.json; then
            echo "proof/site-proof.json unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proof/site-proof.json
          git commit -m "chore(agency): site-proof from CI [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-proof
          path: proof/site-proof.json
