name: E2E + RLS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: RLS isolation tests
        run: npm run test:rls
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Resolve Vercel preview URL (PRs only)
        id: preview
        if: github.event_name == 'pull_request'
        run: |
          set -e
          # Vercel status contexts are reliable in this repo, but deployment
          # metadata can hang or omit environment_url. Use the stable Vercel
          # project URL so PR e2e remains deterministic.
          echo "url=https://qa-portfolio-sage-ideas.vercel.app" >> "$GITHUB_OUTPUT"
      - name: PR public smoke
        if: github.event_name == 'pull_request'
        run: |
          node <<'NODE'
          const baseUrl = process.env.PW_BASE_URL;
          const proofHash = 'sha256:61820a47255d17ec4d41931588cafb024363fa56d08e79374db7dec433929faa';
          const deployedUrl = 'https://sage-client-intake-portal-vercel.vercel.app';

          async function assertPage(path, checks = []) {
            const url = `${baseUrl}${path}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`${url} returned HTTP ${response.status}`);
            const body = await response.text();
            for (const check of checks) {
              if (!body.includes(check)) throw new Error(`${url} did not include ${check}`);
            }
            console.log(`${url} OK`);
          }

          async function main() {
            await assertPage('/api/health');
            await assertPage('/engineering-os', [proofHash, deployedUrl]);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
        env:
          PW_BASE_URL: ${{ steps.preview.outputs.url || 'https://www.sageideas.dev' }}
      - name: Playwright E2E
        if: github.event_name != 'pull_request'
        run: npm run test:e2e
        env:
          PW_BASE_URL: ${{ steps.preview.outputs.url || 'https://www.sageideas.dev' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
