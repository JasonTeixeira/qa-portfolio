name: Auto-translate content

# Write English once. On every push that changes a blog post or the UI message
# catalog, this translates only what's new or changed (sourceHash-gated) into all
# 9 non-English locales and commits the result. You never translate by hand.
#
# One-time setup: add a repo secret DEEPSEEK_API_KEY (Settings -> Secrets and
# variables -> Actions). Without it the job no-ops gracefully.

on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**.mdx'
      - 'lib/i18n/messages/en.json'
  workflow_dispatch: {}

concurrency:
  group: i18n-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Translate new / changed content
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY not set - skipping translation."
            exit 0
          fi
          npx tsx scripts/translate-messages.ts || true
          npx tsx scripts/translate-blog.ts

      - name: Commit translations
        run: |
          git config user.name "sage-i18n-bot"
          git config user.email "noreply@sageideas.dev"
          git add content/blog/i18n lib/i18n/messages
          if git diff --cached --quiet; then
            echo "No new translations."
          else
            git commit -m "chore(i18n): auto-translate new/updated content [skip ci]"
            git push
          fi
