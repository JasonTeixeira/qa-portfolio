              - generic [ref=f6e245]: "01"
              - heading "Nexural QA OS — Signed-Evidence Runner Fleet" [level=3] [ref=f6e246]
              - generic [ref=f6e247]: LIVE REPO + CI
            - paragraph [ref=f6e248]: An 85-runner QA fleet that signs its own evidence and refuses to report a green it did not earn.
            - generic [ref=f6e249]:
              - generic [ref=f6e250]:
                - heading "PROBLEM" [level=4] [ref=f6e251]
                - paragraph [ref=f6e252]: A 39-repo, single-operator SaaS federation had no way to trust its own QA. Runners could return green while doing zero work, and "evidence" was whatever the last terminal scroll said. Verification had to become machine-checkable, not vibes.
              - generic [ref=f6e253]:
                - heading "WHAT I BUILT" [level=4] [ref=f6e254]
                - paragraph [ref=f6e255]: "A Turbo/pnpm monorepo with 85 registered runners producing Ed25519-signed, redacted evidence bundles (qa-run.json, evidence manifest, spans, semgrep/gitleaks reports), plus a `qa verify` trust command that validates any run directory. On top sits an autonomous SDET loop — `qa auto` and `qa gen-tests` — that generates compiling, passing unit/property/BDD tests against a Definition-of-Done oracle."
              - generic [ref=f6e256]:
                - heading "VALIDATION" [level=4] [ref=f6e257]
                - paragraph [ref=f6e258]: A full-fleet E2E CI gate exercises every wired runner against fixtures and hard-fails on hang or crash, alongside proof-gate, SLSA-provenance, and artifact-signing workflows. Measured line coverage was driven from 52% to 91% (3,698 tests) with ratcheting thresholds, so a coverage regression is a build failure, not a footnote.
              - generic [ref=f6e259]:
                - heading "FAILURE MODES CONSIDERED" [level=4] [ref=f6e260]
                - paragraph [ref=f6e261]: "The core threat was the fleet lying to itself: 11 false-pass \"honesty bugs\" — runners returning green while doing nothing — were found and fixed, and fake fallbacks were converted to explicit honest-skips. Evidence tampering is countered by signing; hangs and crashes are hard failures, never timeouts-as-pass."
            - generic [ref=f6e262]:
              - heading "EVIDENCE — REAL ARTIFACT PENDING DROP-IN" [level=4] [ref=f6e263]
