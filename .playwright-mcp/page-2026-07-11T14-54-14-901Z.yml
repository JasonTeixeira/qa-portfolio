              - generic [ref=f6e325]: LOCAL PROOF
            - paragraph [ref=f6e326]: "A machine-computed, 4-tier proof report for a native Expo app (repo: Voza-e2e-stabilization)."
            - generic [ref=f6e327]:
              - generic [ref=f6e328]:
                - heading "PROBLEM" [level=4] [ref=f6e329]
                - paragraph [ref=f6e330]: A 256-screen native language-learning app had no honest answer to "which screens actually work?" Manual spot-checks do not scale to that surface area, and a hand-edited status doc is exactly the kind of claim this portfolio refuses to make.
              - generic [ref=f6e331]:
                - heading "WHAT I BUILT" [level=4] [ref=f6e332]
                - paragraph [ref=f6e333]: "A 4-tier verification system driven by a single screen registry: `npm run verify` machine-computes a PROOF_REPORT — never hand-edited — across static, logic, and engine-contract tiers, and the same registry auto-generates 257 Maestro device flows. All 36 native service contracts are wired to the production backend (176 API routes) with a data-path smoke test that calls every contract."
              - generic [ref=f6e334]:
                - heading "VALIDATION" [level=4] [ref=f6e335]
                - paragraph [ref=f6e336]: 256/256 screens pass Tier 1–3 verification on the current tree, with live signed-in Maestro journeys walking real authenticated data. A full Tier-4 device certification was recorded passing on iOS simulator on 2026-06-14, but the on-disk report honestly shows 0/256 until it is re-run — that result is listed as needing re-verification, not claimed as current.
              - generic [ref=f6e337]:
                - heading "FAILURE MODES CONSIDERED" [level=4] [ref=f6e338]
                - paragraph [ref=f6e339]: Routes that threw on missing deep-link params let one redbox cascade into 139 downstream failures — fixed by making missing params non-fatal. Transient device flakes are retried and recorded as retries, and the report generator rejects hand edits so the scorecard cannot drift from reality.
