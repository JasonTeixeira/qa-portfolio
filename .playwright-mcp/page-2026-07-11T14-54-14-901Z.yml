              - generic [ref=f6e420]: INTERNAL TOOLING
            - paragraph [ref=f6e421]: A proof-first, 140-tool MCP SDLC server paired with a content claim/source integrity harness.
            - generic [ref=f6e422]:
              - generic [ref=f6e423]:
                - heading "PROBLEM" [level=4] [ref=f6e424]
                - paragraph [ref=f6e425]: "\"Nothing stated, everything proven\" fails the moment the tooling itself cannot back its own claims. I needed an SDLC layer where every assertion — about code quality, security, or course content — resolves to a command that was actually run and a record that cannot be quietly edited."
              - generic [ref=f6e426]:
                - heading "WHAT I BUILT" [level=4] [ref=f6e427]
                - paragraph [ref=f6e428]: A terminal-only, 140-tool MCP SDLC server with an append-only, HMAC-anchored proof ledger and proof graph, plus AST engines for SAST with taint tracking, mutation testing, dead-code detection, and module graphs. Alongside it, a Python course-auditor harness (14 pytest suites) that extracts course content into claim/source ledgers behind a scored release gate (≥95 approved / ≥85 pilot / <70 blocked).
              - generic [ref=f6e429]:
                - heading "VALIDATION" [level=4] [ref=f6e430]
                - paragraph [ref=f6e431]: "The kernel holds 68/68 release gates green, with coverage and complexity thresholds enforced inside `release:check` so quality cannot silently rot; a chaos matrix covers 8 fault scenarios including tamper-detected ledgers and fail-closed DAGs. The auditor ran a 23-course / 460+ lesson baseline extracting 17k+ claims, and the SAST engine found a real HIGH (`new Function()`) in a sibling repo."
              - generic [ref=f6e432]:
                - heading "FAILURE MODES CONSIDERED" [level=4] [ref=f6e433]
                - paragraph [ref=f6e434]: A proof ledger is only as good as its tamper story — HMAC anchoring plus chaos tests for corrupt locks and edited ledgers cover that path. On the auditor side, the known weakness is over-extraction of claims from prose, which is documented in the baseline rather than hidden.
