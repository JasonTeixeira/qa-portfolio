<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  :root{--bg:#0B0B0E;--s1:#121218;--s2:#16161d;--line:#1E1E24;--line2:#2A2A33;--ink:#F2EFE9;--muted:#9C9CA6;--faint:#6C6E7C;
    --brand:#3D5AFE;--brand2:#6E86FF;--client:#6ECBFF;--cdn:#4FE3CF;--loadbal:#FF7DB1;--gateway:#8FA0FF;--service:#B79CFF;--cache:#FFA94D;--db:#5EE08C;--queue:#F5C64F;--worker:#E08FFF;--failure:#FF6B6B;--ok:#5EE08C;--warn:#F5C64F;
    --display:'Fraunces',Georgia,serif;--sans:'Hanken Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);padding:48px 46px 90px;-webkit-font-smoothing:antialiased}
  .rail{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--client),var(--cdn),var(--db),var(--queue),var(--cache),var(--loadbal),var(--worker),var(--gateway));z-index:9}
  h1{font-family:var(--display);font-weight:600;font-size:44px;letter-spacing:-.02em}
  .sub{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:6px 0 30px}
  h2{font-family:var(--mono);font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--gateway);margin:38px 0 16px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:18px;min-height:210px;display:flex;flex-direction:column}
  .nm{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:14px}
  .vizbox{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
  svg{overflow:visible} text{font-family:var(--mono);fill:var(--faint)}
  .mono{font-family:var(--mono)} .disp{font-family:var(--display)}
  .tbl{width:100%;border-collapse:collapse;font-size:11px}.tbl td{padding:4px 6px;border-bottom:1px solid var(--line)}.tbl .y{color:var(--ok)}.tbl .n{color:var(--failure)}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}.kpi div{border:1px solid var(--line2);border-radius:9px;padding:10px}
  .kpi .v{font-family:var(--display);font-weight:600;font-size:26px}.kpi .l{font-family:var(--mono);font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em}
  .term{width:100%;background:#0d0d12;border:1px solid var(--line2);border-radius:9px;font-family:var(--mono);font-size:11px;overflow:hidden}
  .term .b{padding:6px 10px;border-bottom:1px solid var(--line);color:var(--faint)}.term .l{padding:3px 10px}.term .g{color:var(--db)}.term .d{color:var(--faint)}
  .code{width:100%;font-family:var(--mono);font-size:11.5px;line-height:1.7}.code .kw{color:var(--gateway)}.code .st{color:var(--db)}.code .c{color:var(--faint)}.code .hl{background:rgba(245,198,79,.12);border-left:2px solid var(--warn);padding-left:6px;margin-left:-8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-family:var(--mono);font-size:10px;padding:5px 9px;border-radius:7px;border:1px solid var(--line2)}
  .node{display:inline-flex;flex-direction:column;gap:2px;padding:7px 11px;border-radius:9px;border:1.5px solid;font-size:11px}
  .node .k{font-family:var(--mono);font-size:8px;text-transform:uppercase;letter-spacing:.08em}
  .bars{width:100%;display:flex;flex-direction:column;gap:12px}
  .steps{width:100%;display:flex;flex-direction:column;gap:8px}
</style></head>
<body>
<div class="rail"></div>
<h1>Sage teaching component catalog</h1>
<div class="sub">variety library · data-viz + diagrams + product · all on the teaching tokens · drop-in for the motion engine</div>
<h2>Data visualization</h2><div class="grid" id="g1"></div>
<h2>Diagrams &amp; systems</h2><div class="grid" id="g2"></div>
<h2>Code &amp; product</h2><div class="grid" id="g3"></div>
<script>
const C=(nm,v)=>`<div class="card"><div class="nm">${nm}</div><div class="vizbox">${v}</div></div>`;
const rep=(n,f)=>Array.from({length:n}).map((_,i)=>f(i)).join('');

// ---------- DATA VIZ ----------
const barChart=()=>`<svg width="220" height="150" viewBox="0 0 220 150">${[60,95,48,120,80,105].map((h,i)=>`<rect x="${18+i*33}" y="${130-h}" width="22" height="${h}" rx="3" fill="var(--brand)" opacity="${(0.55+i*0.07).toFixed(2)}"/>`).join('')}<line x1="10" y1="130" x2="210" y2="130" stroke="var(--line2)"/></svg>`;
const ranking=()=>{const d=[['api',180],['db',150],['cache',110],['queue',70],['cdn',45]];return `<svg width="220" height="150" viewBox="0 0 220 150">${d.map((r,i)=>`<rect x="0" y="${12+i*28}" width="${r[1]}" height="16" rx="4" fill="var(--gateway)" opacity="${(0.9-i*0.13).toFixed(2)}"/><text x="6" y="${24+i*28}" font-size="9" fill="#0B0B0E">${r[0]}</text>`).join('')}</svg>`;};
const multiline=()=>`<svg width="220" height="150" viewBox="0 0 220 150"><polyline points="10,120 45,100 80,110 115,70 150,80 185,40 210,50" fill="none" stroke="var(--db)" stroke-width="2.5"/><polyline points="10,130 45,125 80,120 115,110 150,112 185,95 210,100" fill="none" stroke="var(--loadbal)" stroke-width="2.5"/><line x1="10" y1="135" x2="210" y2="135" stroke="var(--line2)"/></svg>`;
const area=()=>`<svg width="220" height="150" viewBox="0 0 220 150"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand2)" stop-opacity=".5"/><stop offset="1" stop-color="var(--brand2)" stop-opacity="0"/></linearGradient></defs><path d="M10,120 C60,110 90,60 130,70 C170,80 190,35 210,40 L210,135 L10,135 Z" fill="url(#ar)"/><path d="M10,120 C60,110 90,60 130,70 C170,80 190,35 210,40" fill="none" stroke="var(--brand2)" stroke-width="2.5"/></svg>`;
const scatter=()=>{const p=[[40,40,'client'],[60,55,'client'],[50,30,'client'],[150,100,'db'],[170,110,'db'],[160,85,'db'],[110,70,'brand2']];return `<svg width="220" height="150" viewBox="0 0 220 150"><rect x="8" y="8" width="204" height="130" rx="8" fill="none" stroke="var(--line2)"/>${p.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="${q[2]==='brand2'?7:5}" fill="var(--${q[2]})"/>`).join('')}</svg>`;};
const gauge=()=>`<svg width="180" height="120" viewBox="0 0 180 120"><path d="M20 110 A70 70 0 0 1 160 110" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="12"/><path d="M20 110 A70 70 0 0 1 150 62" fill="none" stroke="url(#gg)" stroke-width="12" stroke-linecap="round"/><defs><linearGradient id="gg"><stop offset="0" stop-color="var(--ok)"/><stop offset=".7" stop-color="var(--warn)"/><stop offset="1" stop-color="var(--failure)"/></linearGradient></defs><text x="90" y="100" text-anchor="middle" font-family="Fraunces" font-size="30" fill="var(--ink)">86%</text></svg>`;
const donut=()=>`<svg width="150" height="150" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--line2)" stroke-width="6"/><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--db)" stroke-width="6" stroke-dasharray="62 38" stroke-dashoffset="25"/><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--loadbal)" stroke-width="6" stroke-dasharray="23 77" stroke-dashoffset="-37"/><text x="21" y="23" text-anchor="middle" font-size="7" fill="var(--ink)">62%</text></svg>`;
const heatmap=()=>`<svg width="180" height="150" viewBox="0 0 180 150">${rep(5,r=>rep(6,c=>`<rect x="${10+c*27}" y="${10+r*27}" width="24" height="24" rx="4" fill="var(--brand)" opacity="${(0.12+Math.abs(Math.sin(r*1.3+c))*0.8).toFixed(2)}"/>`))}</svg>`;
const histogram=()=>`<svg width="220" height="150" viewBox="0 0 220 150">${[20,45,80,120,95,60,30,15].map((h,i)=>`<rect x="${14+i*25}" y="${130-h}" width="20" height="${h}" fill="var(--service)" opacity=".8"/>`).join('')}<path d="M14,110 Q120,-10 214,110" fill="none" stroke="var(--warn)" stroke-width="2" opacity=".8"/></svg>`;
const meters=()=>`<div class="bars">${[['latency',72,'db'],['errors',24,'failure'],['coverage',88,'brand2']].map(m=>`<div><div class="mono" style="font-size:9px;color:var(--faint);margin-bottom:4px">${m[0]}</div><div style="height:10px;border-radius:6px;background:var(--line2)"><div style="width:${m[1]}%;height:100%;border-radius:6px;background:var(--${m[2]})"></div></div></div>`).join('')}</div>`;
const funnel=()=>`<svg width="200" height="150" viewBox="0 0 200 150">${[[0,180],[18,140],[36,95],[54,55]].map((d,i)=>`<rect x="${d[0]+10}" y="${18+i*32}" width="${d[1]}" height="24" rx="4" fill="var(--cdn)" opacity="${(0.9-i*0.16).toFixed(2)}"/>`).join('')}</svg>`;
const radar=()=>{const pts=[45,30,55,40,25].map((r,i)=>{const a=i*72*Math.PI/180-Math.PI/2;return `${(r*Math.cos(a)).toFixed(1)},${(r*Math.sin(a)).toFixed(1)}`;}).join(' ');const ax=rep(5,i=>{const a=i*72*Math.PI/180-Math.PI/2;return `<line x1="0" y1="0" x2="${(60*Math.cos(a)).toFixed(1)}" y2="${(60*Math.sin(a)).toFixed(1)}" stroke="var(--line2)"/>`;});return `<svg width="160" height="150" viewBox="0 0 160 150"><g transform="translate(80,75)">${ax}<polygon points="${pts}" fill="var(--brand)" fill-opacity=".3" stroke="var(--brand2)" stroke-width="2"/></g></svg>`;};

// ---------- DIAGRAMS ----------
const flow=()=>`<div style="display:flex;align-items:center;gap:8px"><span class="node" style="border-color:var(--client);color:var(--client)"><span class="k">in</span>Ask</span><span style="color:var(--gateway)">→</span><span class="node" style="border-color:var(--gateway);color:var(--gateway)"><span class="k">svc</span>API</span><span style="color:var(--gateway)">→</span><span class="node" style="border-color:var(--db);color:var(--db)"><span class="k">out</span>DB</span></div>`;
const sequence=()=>`<svg width="200" height="150" viewBox="0 0 200 150"><line x1="40" y1="20" x2="40" y2="140" stroke="var(--line2)"/><line x1="150" y1="20" x2="150" y2="140" stroke="var(--line2)"/><text x="40" y="14" text-anchor="middle" font-size="9" fill="var(--client)">client</text><text x="150" y="14" text-anchor="middle" font-size="9" fill="var(--db)">server</text><line x1="40" y1="45" x2="148" y2="45" stroke="var(--gateway)" stroke-width="2"/><text x="94" y="40" text-anchor="middle" font-size="8">request</text><line x1="150" y1="80" x2="42" y2="80" stroke="var(--db)" stroke-width="2" stroke-dasharray="4 3"/><text x="94" y="75" text-anchor="middle" font-size="8">200 OK</text><line x1="40" y1="110" x2="148" y2="110" stroke="var(--gateway)" stroke-width="2"/></svg>`;
const stateM=()=>`<svg width="200" height="150" viewBox="0 0 200 150"><line x1="62" y1="42" x2="128" y2="52" stroke="var(--line2)" stroke-width="2"/><line x1="140" y1="76" x2="108" y2="100" stroke="var(--line2)" stroke-width="2"/><circle cx="40" cy="40" r="22" fill="none" stroke="var(--db)" stroke-width="2"/><text x="40" y="44" text-anchor="middle" font-size="9" fill="var(--ink)">idle</text><circle cx="150" cy="55" r="22" fill="none" stroke="var(--warn)" stroke-width="2"/><text x="150" y="59" text-anchor="middle" font-size="8" fill="var(--ink)">run</text><circle cx="95" cy="120" r="22" fill="none" stroke="var(--failure)" stroke-width="2"/><text x="95" y="124" text-anchor="middle" font-size="8" fill="var(--ink)">fail</text></svg>`;
const tree=()=>`<svg width="200" height="150" viewBox="0 0 200 150"><path d="M102,36 L42,70 M102,36 L102,70 M102,36 L162,70 M102,92 L102,120" stroke="var(--line2)" fill="none"/><rect x="80" y="14" width="44" height="22" rx="5" fill="none" stroke="var(--brand2)"/><rect x="20" y="70" width="44" height="22" rx="5" fill="none" stroke="var(--service)"/><rect x="80" y="70" width="44" height="22" rx="5" fill="none" stroke="var(--service)"/><rect x="140" y="70" width="44" height="22" rx="5" fill="none" stroke="var(--service)"/><rect x="80" y="120" width="44" height="22" rx="5" fill="none" stroke="var(--cdn)"/></svg>`;
const network=()=>{const n=[[50,40,'client'],[120,30,'gateway'],[160,80,'db'],[90,90,'service'],[70,130,'cache']];return `<svg width="200" height="150" viewBox="0 0 200 150"><path d="M50,40 L120,30 M50,40 L90,90 M120,30 L160,80 M90,90 L160,80 M90,90 L70,130" stroke="var(--line2)"/>${n.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="var(--${p[2]})"/>`).join('')}</svg>`;};
const layered=()=>`<div style="width:100%;display:flex;flex-direction:column;gap:7px">${[['edge / CDN','cdn'],['gateway','gateway'],['services','service'],['data','db']].map(l=>`<div style="border:1.5px solid var(--${l[1]});border-radius:8px;padding:8px;text-align:center;font-family:var(--mono);font-size:10px;color:var(--${l[1]})">${l[0]}</div>`).join('')}</div>`;
const venn=()=>`<svg width="180" height="140" viewBox="0 0 180 140"><circle cx="70" cy="70" r="45" fill="var(--brand)" fill-opacity=".22" stroke="var(--brand2)"/><circle cx="110" cy="70" r="45" fill="var(--db)" fill-opacity=".22" stroke="var(--db)"/><text x="50" y="74" text-anchor="middle" font-size="9" fill="var(--ink)">fast</text><text x="130" y="74" text-anchor="middle" font-size="9" fill="var(--ink)">safe</text></svg>`;
const swimlane=()=>`<svg width="200" height="140" viewBox="0 0 200 140">${['user','api','worker'].map((l,r)=>`<line x1="46" y1="${30+r*40}" x2="196" y2="${30+r*40}" stroke="var(--line2)"/><text x="4" y="${34+r*40}" font-size="8">${l}</text>`).join('')}<path d="M90,30 L110,70 M140,70 L150,110" stroke="var(--faint)"/><rect x="60" y="20" width="30" height="20" rx="4" fill="var(--client)"/><rect x="110" y="60" width="30" height="20" rx="4" fill="var(--gateway)"/><rect x="150" y="100" width="30" height="20" rx="4" fill="var(--worker)"/></svg>`;
const table=()=>`<table class="tbl"><tr><td></td><td>naive</td><td>ours</td></tr><tr><td>grounded</td><td class="n">✗</td><td class="y">✓</td></tr><tr><td>cites</td><td class="n">✗</td><td class="y">✓</td></tr><tr><td>abstains</td><td class="n">✗</td><td class="y">✓</td></tr></table>`;
const queue=()=>`<svg width="200" height="120" viewBox="0 0 200 120"><rect x="20" y="45" width="160" height="34" rx="6" fill="none" stroke="var(--queue)"/>${rep(4,i=>`<rect x="${30+i*30}" y="52" width="22" height="20" rx="3" fill="var(--queue)" opacity="${(0.9-i*0.18).toFixed(2)}"/>`)}<text x="100" y="102" text-anchor="middle" font-size="9">FIFO · depth 4</text></svg>`;
const gantt=()=>`<svg width="200" height="130" viewBox="0 0 200 130"><line x1="0" y1="12" x2="200" y2="12" stroke="var(--line2)"/>${[[10,90,'client'],[40,120,'gateway'],[80,70,'service'],[120,60,'db']].map((d,i)=>`<rect x="${d[0]}" y="${20+i*26}" width="${d[1]}" height="15" rx="4" fill="var(--${d[2]})" opacity=".85"/>`).join('')}</svg>`;
const split=()=>`<div style="display:flex;gap:8px;width:100%"><div style="flex:1;border:1.5px solid var(--failure);border-radius:8px;padding:12px;text-align:center"><div class="disp" style="font-size:16px">demo</div><div style="color:var(--failure)">✗</div></div><div style="flex:1;border:1.5px solid var(--ok);border-radius:8px;padding:12px;text-align:center"><div class="disp" style="font-size:16px">prod</div><div style="color:var(--ok)">✓</div></div></div>`;

// ---------- CODE & PRODUCT ----------
const codewalk=()=>`<div class="code"><div class="c"># retrieve</div><div>ctx = search(q, k=<span class="st">4</span>)</div><div class="hl">ans = llm(q, ctx)</div><div class="c"># ground it</div><div>assert cited(ans)</div></div>`;
const terminal=()=>`<div class="term"><div class="b">▸ pytest -q</div><div class="l g">·····  5 passed</div><div class="l d">faithfulness: 1.00</div><div class="l g">✓ deploy gate</div></div>`;
const diff=()=>`<div class="code" style="width:100%"><div style="color:var(--failure);background:rgba(255,107,107,.08)">- answer(q)</div><div style="color:var(--ok);background:rgba(94,224,140,.08)">+ answer(q, ctx)</div><div style="color:var(--ok);background:rgba(94,224,140,.08)">+ if not ctx: abstain()</div></div>`;
const kpi=()=>`<div class="kpi"><div><div class="v" style="color:var(--db)">1.00</div><div class="l">faithful</div></div><div><div class="v" style="color:var(--brand2)">142ms</div><div class="l">p95</div></div><div><div class="v" style="color:var(--warn)">4</div><div class="l">top-k</div></div><div><div class="v" style="color:var(--ok)">0</div><div class="l">ungrounded</div></div></div>`;
const chat=()=>`<div style="width:100%;display:flex;flex-direction:column;gap:8px"><div style="align-self:flex-end;background:rgba(61,90,254,.14);border:1px solid var(--line2);border-radius:12px;padding:8px 12px;font-size:11px">refund policy?</div><div style="background:var(--s2);border:1px solid var(--line2);border-radius:12px;padding:8px 12px;font-size:11px">30 days <span style="color:var(--ok)">[1]</span></div></div>`;
const callout=()=>`<svg width="200" height="130" viewBox="0 0 200 130"><rect x="20" y="30" width="110" height="60" rx="8" fill="var(--s2)" stroke="var(--line2)"/><text x="34" y="64" font-size="10" fill="var(--ink)">value = 42</text><path d="M130,50 L175,30" stroke="var(--warn)" stroke-width="2"/><circle cx="175" cy="30" r="4" fill="var(--warn)"/><text x="150" y="20" font-size="8" fill="var(--warn)">← here</text></svg>`;
const stepseq=()=>`<div class="steps">${rep(3,i=>`<div style="display:flex;align-items:center;gap:10px"><span style="width:22px;height:22px;border-radius:50%;border:1.5px solid var(--brand2);color:var(--brand2);display:grid;place-items:center;font-family:var(--mono);font-size:10px">${i+1}</span><span style="height:8px;flex:1;border-radius:4px;background:var(--line2)"></span></div>`)}</div>`;
const chipcloud=()=>{const t=['retrieve','embed','top-k','cite','abstain','faithful','deploy','ground'],h=['client','gateway','service','db','warn','cdn','loadbal','worker'];return `<div class="chips">${t.map((x,i)=>`<span class="chip" style="border-color:var(--${h[i]});color:var(--${h[i]})">${x}</span>`).join('')}</div>`;};

document.getElementById('g1').innerHTML=[['bar chart',barChart()],['horizontal ranking',ranking()],['multi-line',multiline()],['area / trend',area()],['scatter + clusters',scatter()],['radial gauge',gauge()],['donut / split',donut()],['heatmap matrix',heatmap()],['histogram / dist',histogram()],['progress meters',meters()],['funnel',funnel()],['radar / spider',radar()]].map(c=>C(c[0],c[1])).join('');
document.getElementById('g2').innerHTML=[['node-edge flow',flow()],['sequence diagram',sequence()],['state machine',stateM()],['tree / hierarchy',tree()],['network graph',network()],['layered architecture',layered()],['venn / overlap',venn()],['swimlane',swimlane()],['comparison table',table()],['queue / buffer',queue()],['timeline / gantt',gantt()],['before / after split',split()]].map(c=>C(c[0],c[1])).join('');
document.getElementById('g3').innerHTML=[['code walkthrough',codewalk()],['terminal / output',terminal()],['diff view',diff()],['KPI tiles',kpi()],['chat UI',chat()],['annotation / callout',callout()],['step sequence',stepseq()],['tag / chip cloud',chipcloud()]].map(c=>C(c[0],c[1])).join('');
</script>
</body></html>
