<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root { --ink:#F4F2EC; --muted:#A9ABB8; --accent:#3D5AFE; --accent-ink:#9AA8FF;
    --serif:'Fraunces',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,monospace; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:2048px; height:1152px; overflow:hidden; }
  body { background:#0A0B0F; position:relative; }
  .grid { position:absolute; inset:0;
    background-image: linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px,transparent 1px);
    background-size:72px 72px; mask-image: radial-gradient(120% 80% at 50% 50%, #000 35%, transparent 80%); }
  .aurora { position:absolute; inset:0;
    background: radial-gradient(40% 55% at 30% 50%, rgba(61,90,254,0.28), transparent 60%),
                radial-gradient(36% 50% at 74% 46%, rgba(122,140,255,0.14), transparent 60%); }
  /* YouTube TV-safe area = center 1546×423; keep everything inside it */
  .safe { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:1546px; height:423px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:22px; }
  .lockup { display:flex; align-items:center; gap:22px; }
  .mark { width:78px; height:78px; border-radius:20px; display:grid; place-items:center; background:var(--accent); box-shadow:0 0 40px rgba(61,90,254,0.55); }
  .word { font-family:var(--serif); font-weight:600; font-size:82px; letter-spacing:-0.02em; color:var(--ink); line-height:1; }
  .tag { font-family:var(--serif); font-weight:500; font-size:33px; color:var(--muted); letter-spacing:-0.01em; }
  .tag em { font-style:italic; color:var(--accent-ink); }
  .meta { display:flex; align-items:center; gap:18px; font-family:var(--mono); font-size:16px; letter-spacing:0.14em; text-transform:uppercase; color:#6C6E7C; }
  .meta .dot { width:6px; height:6px; border-radius:50%; background:var(--accent-ink); }
</style></head>
<body>
  <div class="grid"></div>
  <div class="aurora"></div>
  <div class="safe">
    <div class="lockup">
      <span class="mark">
        <svg width="50" height="50" viewBox="0 0 64 64" fill="none"><g transform="translate(0 -6)">
          <path d="M20 44 A10 10 0 0 1 20 24 A13 13 0 0 1 45 21 A9 9 0 0 1 48 44 Z" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/>
          <circle cx="26" cy="54" r="3.4" fill="#fff"/><circle cx="36" cy="54" r="3.4" fill="#fff"/><circle cx="46" cy="54" r="3.4" fill="#fff"/>
        </g></svg>
      </span>
      <span class="word">Sage Academy</span>
    </div>
    <div class="tag">Learn to build with AI — by building. <em>Proof, not paper.</em></div>
    <div class="meta"><span>New build every week</span><span class="dot"></span><span>every concept ends in a runnable proof</span><span class="dot"></span><span>sageideas.dev</span></div>
  </div>
</body></html>
