<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root { --ink:#F4F2EC; --muted:#B4B6C2; --faint:#7A7C88; --accent:#3D5AFE; --accent-ink:#9AA8FF;
    --serif:'Fraunces',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,monospace; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:720px; overflow:hidden; }
  body { position:relative; background:#0A0B0F; font-family:var(--serif); color:var(--ink); }
  .bg { position:absolute; inset:0; background-image:url('../renders/hero-rag-1.png'); background-size:cover; background-position:center right; }
  /* legibility gradient over the left text zone */
  .scrim { position:absolute; inset:0; background: linear-gradient(90deg, #0A0B0F 26%, rgba(10,11,15,0.82) 44%, rgba(10,11,15,0.15) 66%, transparent 82%); }
  .frame { position:absolute; inset:0; padding:74px 72px; display:flex; flex-direction:column; }
  .kicker { font-family:var(--mono); font-size:21px; font-weight:500; letter-spacing:0.24em; text-transform:uppercase; color:var(--accent-ink); display:flex; align-items:center; gap:14px; }
  .kicker .dot { width:9px; height:9px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #C6CEFF, var(--accent)); box-shadow:0 0 14px rgba(61,90,254,0.9); }
  .title { margin-top:auto; font-weight:600; font-size:112px; line-height:0.96; letter-spacing:-0.025em; text-wrap:balance; max-width:13ch; }
  .title em { font-style:italic; font-weight:500; color:var(--accent-ink); }
  .sub { margin-top:20px; font-family:var(--mono); font-size:22px; color:var(--muted); }
  .foot { margin-top:auto; display:flex; align-items:center; gap:14px; }
  .mark { width:46px; height:46px; border-radius:12px; display:grid; place-items:center; background:var(--accent); box-shadow:0 0 26px rgba(61,90,254,0.6); }
  .wm { display:flex; flex-direction:column; line-height:1.1; }
  .wm b { font-family:var(--serif); font-weight:600; font-size:24px; }
  .wm span { font-family:var(--mono); font-size:11.5px; letter-spacing:0.22em; text-transform:uppercase; color:var(--faint); }
</style></head>
<body>
  <div class="bg"></div><div class="scrim"></div>
  <div class="frame">
    <div class="kicker"><span class="dot"></span>AI ENGINEERING · EXPLAINED</div>
    <h1 class="title">What is <em>RAG</em>, really?</h1>
    <div class="sub">answer from your docs — or say "I don't know"</div>
    <div class="foot">
      <span class="mark"><svg width="30" height="30" viewBox="0 0 64 64" fill="none"><g transform="translate(0 -6)"><path d="M20 44 A10 10 0 0 1 20 24 A13 13 0 0 1 45 21 A9 9 0 0 1 48 44 Z" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/><circle cx="26" cy="54" r="3.4" fill="#fff"/><circle cx="36" cy="54" r="3.4" fill="#fff"/><circle cx="46" cy="54" r="3.4" fill="#fff"/></g></svg></span>
      <span class="wm"><b>Sage Academy</b><span>proof, not paper</span></span>
    </div>
  </div>
</body></html>
