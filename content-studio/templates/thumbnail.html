<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>Sage Thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0A0B0F;
    --ink: #F4F2EC;
    --muted: #A9ABB8;
    --faint: #6C6E7C;
    --accent: #3D5AFE;
    --accent-ink: #9AA8FF;
    --green: #3ECF8E;
    --line: rgba(255,255,255,0.09);
    --serif: 'Fraunces', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    position: relative;
  }
  /* atmosphere */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(120% 90% at 22% 40%, #000 30%, transparent 78%);
  }
  .aurora {
    position: absolute; inset: 0;
    background:
      radial-gradient(48% 60% at 12% 8%, rgba(61,90,254,0.30), transparent 60%),
      radial-gradient(40% 50% at 92% 100%, rgba(122,140,255,0.14), transparent 60%);
  }
  .frame { position: absolute; inset: 0; padding: 74px 72px; display: flex; align-items: center; gap: 48px; }

  /* left: the thesis */
  .col { flex: 1 1 58%; min-width: 0; display: flex; flex-direction: column; height: 100%; }
  .kicker {
    font-family: var(--mono);
    font-size: 21px; font-weight: 500;
    letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--accent-ink);
    display: flex; align-items: center; gap: 14px;
  }
  .kicker .dot { width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #C6CEFF, var(--accent)); box-shadow: 0 0 14px rgba(61,90,254,0.8); }
  .title {
    margin-top: auto;
    font-weight: 600;
    font-size: 104px;
    line-height: 0.98;
    letter-spacing: -0.025em;
    text-wrap: balance;
    max-width: 15ch;
  }
  .title em { font-style: italic; font-weight: 500; color: var(--accent-ink); }
  .sub {
    margin-top: 22px;
    font-family: var(--mono);
    font-size: 22px; font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.01em;
  }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 14px; }
  .mark {
    width: 46px; height: 46px; border-radius: 12px; flex: none;
    display: grid; place-items: center;
    background: var(--accent);
    box-shadow: 0 0 26px rgba(61,90,254,0.5);
  }
  .wordmark { display: flex; flex-direction: column; line-height: 1.1; }
  .wordmark b { font-family: var(--serif); font-weight: 600; font-size: 24px; letter-spacing: -0.01em; }
  .wordmark span { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--faint); }

  /* right: the proof motif (code card) */
  .aside { flex: 0 0 34%; display: flex; align-items: center; justify-content: center; }
  .card {
    width: 100%; border: 1px solid var(--line); border-radius: 18px;
    background: linear-gradient(180deg, rgba(122,140,255,0.06), rgba(255,255,255,0.015));
    box-shadow: 0 40px 90px -30px rgba(0,0,0,0.9);
    overflow: hidden;
    transform: rotate(2.4deg);
  }
  .card .bar { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .card .bar i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .card .bar .t { margin-left: 8px; font-family: var(--mono); font-size: 12.5px; color: var(--faint); letter-spacing: 0.06em; }
  .code { padding: 20px 20px 22px; font-family: var(--mono); font-size: 16.5px; line-height: 1.65; }
  .code .c { color: var(--faint); }
  .code .k { color: var(--accent-ink); }
  .code .g { color: var(--green); }
  .code .r { color: #F0796E; }
  .verdict {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 6px;
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.08em;
    color: var(--green); border: 1px solid rgba(62,207,142,0.4); border-radius: 6px; padding: 5px 10px;
  }

  /* episode chip */
  .ep {
    position: absolute; top: 74px; right: 72px;
    font-family: var(--mono); font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--faint); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="aurora"></div>
  <div class="ep" id="ep">EP.01</div>
  <div class="frame">
    <div class="col">
      <div class="kicker"><span class="dot"></span><span id="kicker">AI ENGINEERING · EXPLAINED</span></div>
      <h1 class="title" id="title">What is <em>RAG</em>, really?</h1>
      <div class="sub" id="sub">grounding an LLM in your own docs — in 8 minutes</div>
      <div class="foot">
        <span class="mark">
          <svg width="30" height="30" viewBox="0 0 64 64" fill="none">
            <g transform="translate(0 -6)">
              <path d="M20 44 A10 10 0 0 1 20 24 A13 13 0 0 1 45 21 A9 9 0 0 1 48 44 Z" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/>
              <circle cx="26" cy="54" r="3.4" fill="#fff"/><circle cx="36" cy="54" r="3.4" fill="#fff"/><circle cx="46" cy="54" r="3.4" fill="#fff"/>
            </g>
          </svg>
        </span>
        <span class="wordmark"><b>Sage Academy</b><span>proof, not paper</span></span>
      </div>
    </div>
    <div class="aside">
      <div class="card">
        <div class="bar"><i style="background:#F0796E"></i><i style="background:#E9A13B"></i><i style="background:#3ECF8E"></i><span class="t" id="cardtitle">rag.py</span></div>
        <div class="code" id="code">
<span class="c"># retrieve, then answer</span><br/>
<span class="k">ctx</span> = search(<span class="g">query</span>, k=<span class="k">4</span>)<br/>
<span class="k">ans</span> = llm(<span class="g">query</span>, ctx)<br/>
<span class="c"># no source? refuse.</span><br/>
<span class="r">assert</span> ans.grounded<br/>
<span class="verdict">✓ grounded · cited</span>
        </div>
      </div>
    </div>
  </div>
  <script>
    const p = new URLSearchParams(location.search);
    const set = (id, key, html) => { const v = p.get(key); if (v !== null) { document.getElementById(id)[html ? 'innerHTML' : 'textContent'] = v; } };
    set('kicker', 'k');
    set('title', 't', true);
    set('sub', 's');
    set('ep', 'n');
    set('cardtitle', 'file');
    set('code', 'code', true);
    if (p.get('n') === '') document.getElementById('ep').style.display = 'none';
    if (p.get('s') === '') document.getElementById('sub').style.display = 'none';
  </script>
</body>
</html>
