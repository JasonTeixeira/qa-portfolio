<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Poppins:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  :root{--bg:#0A0B0F;--ink:#F4F2EC;--muted:#B4B6C2;--accent:#3D5AFE;--accentink:#9AA8FF;--green:#3ECF8E;--red:#F0796E;--amber:#E9A13B;
    --serif:'Fraunces',Georgia,serif;--pop:'Poppins',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden;background:#000}
  #stage{position:relative;width:1280px;height:720px;background:
    radial-gradient(90% 70% at 50% -10%,rgba(61,90,254,0.18),transparent 60%),var(--bg);color:var(--ink);overflow:hidden}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(120% 90% at 50% 30%,#000 40%,transparent 85%)}
  .scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .5s ease}
  .scene.on{opacity:1}
  /* caption bar */
  #cap{position:absolute;left:0;right:0;bottom:56px;text-align:center;padding:0 90px;font-family:var(--pop);font-weight:800;font-size:46px;line-height:1.12;letter-spacing:-.01em;text-shadow:0 3px 24px rgba(0,0,0,.6);z-index:5}
  #cap .w{opacity:0;display:inline-block;transform:translateY(8px);transition:opacity .28s,transform .28s}
  #cap .w.show{opacity:1;transform:none}
  #cap .hl{color:var(--accentink)}
  #cap .g{color:var(--green)}#cap .r{color:var(--red)}
  /* brand chrome */
  .brand{position:absolute;top:34px;left:40px;display:flex;align-items:center;gap:11px;z-index:6;opacity:.9}
  .brand .mk{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
  .brand b{font-family:var(--serif);font-weight:600;font-size:19px}
  #prog{position:absolute;top:44px;right:40px;display:flex;gap:6px;z-index:6}
  #prog i{width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.16)}#prog i.on{background:var(--accent)}
  /* reusable bits */
  .win{width:520px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:linear-gradient(180deg,rgba(122,140,255,.06),rgba(255,255,255,.015));box-shadow:0 40px 90px -30px #000;overflow:hidden}
  .win .bar{display:flex;align-items:center;gap:8px;padding:13px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
  .win .bar i{width:11px;height:11px;border-radius:50%}.win .bar .t{margin-left:6px;font-family:var(--mono);font-size:13px;color:#6C6E7C}
  .win .body{padding:22px;font-family:var(--mono);font-size:19px;line-height:1.7}
  .c{color:#6C6E7C}.k{color:var(--accentink)}.s{color:var(--green)}.rr{color:var(--red)}
  .chip{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-family:var(--mono);font-size:15px;padding:6px 12px;border-radius:8px}
  .chip.ok{color:var(--green);border:1px solid rgba(62,207,142,.45)}.chip.bad{color:var(--red);border:1px solid rgba(240,121,110,.45)}
  .headline{font-family:var(--serif);font-weight:600;font-size:76px;line-height:1.0;letter-spacing:-.02em;text-align:center;max-width:20ch}
  .headline em{font-style:italic;color:var(--accentink)}
  /* diagram nodes */
  .flow{display:flex;align-items:center;gap:30px}
  .node{padding:20px 26px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);font-family:var(--pop);font-weight:700;font-size:26px;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
  .node.on{opacity:1;transform:none}
  .node.hot{border-color:var(--accent);background:rgba(61,90,254,.16);color:var(--accentink)}
  .arrow{font-family:var(--mono);font-size:34px;color:#6C6E7C;opacity:0;transition:opacity .5s}.arrow.on{opacity:1}
  .big{font-family:var(--pop);font-weight:800;font-size:150px;color:var(--green)}
  .fade{opacity:0;transition:opacity .6s}.fade.on{opacity:1}
  .pop{opacity:0;transform:scale(.7);transition:opacity .4s,transform .4s cubic-bezier(.16,1,.3,1)}.pop.on{opacity:1;transform:none}
  .cta{font-family:var(--mono);font-size:24px;color:var(--accentink);letter-spacing:.04em}
  #startbtn{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,6,10,.75);z-index:20;cursor:pointer;font-family:var(--pop);font-weight:700;color:#fff;font-size:24px}
</style></head>
<body>
<div id="stage">
  <div class="grid"></div>
  <div class="brand"><span class="mk"><svg width="20" height="20" viewBox="0 0 64 64" fill="none"><g transform="translate(0 -6)"><path d="M20 44 A10 10 0 0 1 20 24 A13 13 0 0 1 45 21 A9 9 0 0 1 48 44 Z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><circle cx="26" cy="54" r="3.6" fill="#fff"/><circle cx="36" cy="54" r="3.6" fill="#fff"/><circle cx="46" cy="54" r="3.6" fill="#fff"/></g></svg></span><b>Sage Academy</b></div>
  <div id="prog"></div>
  <div id="scenes"></div>
  <div id="cap"></div>
  <div id="startbtn">▶ Play the flagship cut</div>
</div>
<script>
const V = '/renders/vo/';
// scene: { audio, cap (with **hl**, ~g~, ^r^ markers), html, animate(el, dur) }
const scenes = [
  { audio:'01-hook', cap:"Your AI **confidently** makes things ^up^.",
    html:`<div class="win"><div class="bar"><i style="background:#F0796E"></i><i style="background:#E9A13B"></i><i style="background:#3ECF8E"></i><span class="t">chat</span></div><div class="body"><div class="c">Q: what's our refund window?</div><div class="fade" data-a="1" style="margin-top:8px">A: <b>30 days.</b></div><div class="chip bad fade" data-a="2">✗ not in any document</div></div></div>` },
  { audio:'02-hook2', cap:"RAG fixes it — by teaching it to say **I don't know**.",
    html:`<div class="headline fade" data-a="0">Answer from the <em>source</em>.<br/>Or don't answer.</div>` },
  { audio:'03-frame', cap:"RAG is **two moves**: retrieve, then answer.",
    html:`<div class="flow"><div class="node" data-a="0">Question</div><div class="arrow" data-a="1">→</div><div class="node" data-a="2">Retrieve</div><div class="arrow" data-a="3">→</div><div class="node" data-a="4">Answer + cite</div></div>` },
  { audio:'04-retrieve', cap:"Pull the **4 closest** passages — search over meaning.",
    html:`<div class="win"><div class="bar"><i style="background:#F0796E"></i><i style="background:#E9A13B"></i><i style="background:#3ECF8E"></i><span class="t">retrieve.py</span></div><div class="body"><div class="fade" data-a="0">chunks = split(docs)</div><div class="fade" data-a="1">vecs = embed(chunks)</div><div class="fade" data-a="2"><span class="k">ctx</span> = search(q, k=<span class="k">4</span>)</div></div></div>` },
  { audio:'05-answer', cap:"Now it's **right** — and it ~g~cites the source~g~.",
    html:`<div class="win"><div class="bar"><i style="background:#F0796E"></i><i style="background:#E9A13B"></i><i style="background:#3ECF8E"></i><span class="t">answer.py</span></div><div class="body"><div class="fade" data-a="0"><span class="k">ans</span> = llm(q, ctx)</div><div class="chip ok fade" data-a="1">✓ grounded · cited [1]</div></div></div>` },
  { audio:'06-abstain', cap:"The trap: naive RAG **still makes it ^up^**.",
    html:`<div class="win"><div class="bar"><i style="background:#F0796E"></i><i style="background:#E9A13B"></i><i style="background:#3ECF8E"></i><span class="t">out_of_scope</span></div><div class="body"><div class="c">Q: not in the docs…</div><div class="fade" data-a="1" style="margin-top:8px">A: <b>invents an answer</b></div><div class="chip bad fade" data-a="2">✗ ungrounded</div></div></div>` },
  { audio:'07-abstain2', cap:"One guardrail: no source → **refuse**. ~g~Now it's honest~g~.",
    html:`<div class="win"><div class="bar"><i style="background:#F0796E"></i><i style="background:#E9A13B"></i><i style="background:#3ECF8E"></i><span class="t">guard.py</span></div><div class="body"><div class="fade" data-a="0"><span class="rr">if</span> not ctx.covers(q):</div><div class="fade" data-a="1">&nbsp;&nbsp;refuse()</div><div class="chip ok fade" data-a="2">✓ "not in the documents"</div></div></div>` },
  { audio:'08-prove', cap:"Prove it: a **faithfulness check**. ~g~Green means grounded~g~.",
    html:`<div style="text-align:center"><div class="big pop" data-a="0">✓</div><div class="cta fade" data-a="1" style="margin-top:10px;color:#3ECF8E">0 ungrounded claims · gate passed</div></div>` },
  { audio:'09-close', cap:"Build it free at **sageideas.dev/academy**. Proof, not paper.",
    html:`<div style="text-align:center"><div class="headline fade" data-a="0">Retrieve · answer · <em>refuse</em> · verify.</div><div class="cta fade" data-a="1" style="margin-top:22px">▸ sageideas.dev/academy — free, in your browser</div></div>` },
];

function renderCap(str){
  // markers: **hl** ~g~green~g~ ^r^red^r^  -> spans, then word-wrap for reveal
  let html = str.replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1</span>').replace(/~g~(.+?)~g~/g,'<span class="g">$1</span>').replace(/\^(.+?)\^/g,'<span class="r">$1</span>');
  // wrap each word (keeping spans) in .w for staggered reveal
  const tmp=document.createElement('div'); tmp.innerHTML=html;
  const out=[];
  tmp.childNodes.forEach(n=>{
    if(n.nodeType===3){ n.textContent.split(/(\s+)/).forEach(t=>{ if(t.trim()) out.push('<span class="w">'+t+'</span>'); else if(t) out.push(t); }); }
    else { const cls=n.className? ' '+n.className:''; out.push('<span class="w'+cls+'">'+n.textContent+'</span>'); }
  });
  return out.join(' ');
}
const scEl=document.getElementById('scenes'), capEl=document.getElementById('cap'), prog=document.getElementById('prog');
scenes.forEach(()=>{const i=document.createElement('i');prog.appendChild(i);});

function playScene(idx){
  return new Promise(resolve=>{
    const s=scenes[idx];
    [...prog.children].forEach((n,i)=>n.classList.toggle('on',i<=idx));
    const div=document.createElement('div'); div.className='scene'; div.innerHTML=s.html; scEl.innerHTML=''; scEl.appendChild(div);
    capEl.innerHTML=renderCap(s.cap);
    const words=[...capEl.querySelectorAll('.w')];
    requestAnimationFrame(()=>div.classList.add('on'));
    const audio=new Audio(V+s.audio+'.mp3');
    audio.addEventListener('loadedmetadata',()=>{
      const dur=audio.duration||4;
      // reveal caption words across the clip
      words.forEach((w,i)=>setTimeout(()=>w.classList.add('show'), 250 + i*(Math.max(1,dur*1000-900)/Math.max(1,words.length))));
      // reveal staged elements [data-a] evenly
      const stagedEls=[...div.querySelectorAll('[data-a]')].sort((a,b)=>a.dataset.a-b.dataset.a);
      stagedEls.forEach((el,i)=>setTimeout(()=>{el.classList.add('on');},400 + i*(dur*1000/(stagedEls.length+1))));
    });
    audio.addEventListener('ended',()=>{ div.classList.remove('on'); setTimeout(resolve,420); });
    audio.play().catch(()=>{ setTimeout(()=>{[...div.querySelectorAll('[data-a]')].forEach(el=>el.classList.add('on'));words.forEach(w=>w.classList.add('show'));}, 200); setTimeout(resolve,4000); });
  });
}
async function run(){ for(let i=0;i<scenes.length;i++){ await playScene(i);} capEl.innerHTML=''; }
document.getElementById('startbtn').addEventListener('click',e=>{ e.currentTarget.remove(); run(); });
// expose for headless frame capture
window.__scene=(i)=>{ document.getElementById('startbtn')?.remove(); const s=scenes[i]; const div=document.createElement('div'); div.className='scene on'; div.innerHTML=s.html; scEl.innerHTML=''; scEl.appendChild(div); [...div.querySelectorAll('[data-a]')].forEach(el=>el.classList.add('on')); capEl.innerHTML=renderCap(s.cap); capEl.querySelectorAll('.w').forEach(w=>w.classList.add('show')); [...prog.children].forEach((n,k)=>n.classList.toggle('on',k<=i)); };
</script>
</body></html>
