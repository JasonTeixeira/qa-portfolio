<script type="text/x-dc" data-dc-script="" data-props="{}">
class Component extends DCLogic {
  state = { idx: 0, revealed: false, grades: [], transfer: '', transferBusy: false };

  async getTransfer() {
    if (this.state.transferBusy) return;
    this.setState({ transferBusy: true });
    let q;
    try {
      if (!window.claude || !window.claude.complete) throw new Error('offline');
      q = await window.claude.complete({
        system: 'You are Sprout, generating ONE fresh spaced-recall transfer question for an engineer. Their held concepts: blast radius (bounded by readers, transitive readers count), idempotency keys (derived from intent, not time), and defended omissions on maps. Write one question, 35 words max, applying ONE of these concepts to a NOVEL domain they have not seen (feature flags, cron, CDN purge, IAM, migrations). Plain text, the question only.',
        messages: [{ role: 'user', content: 'One fresh transfer prompt, please.' }],
      });
    } catch (e) {
      q = 'A feature flag flips for 2% of users, but 9% see the change. Who reads that flag that your rollout map forgot?';
    }
    this.setState({ transfer: (q || '').trim(), transferBusy: false });
  }

  cards() {
    return [
      { tag: 'Course 00 · blast radius', due: 'due · 7-day window', prompt: 'What bounds a change\'s blast radius?', answer: 'Everything that reads what you touched — including transitive readers. The radius is a property of the read graph, not the diff.' },
      { tag: 'Course 00 · decisions', due: 'due · 3-day window', prompt: 'What makes an omission from a map defensible?', answer: 'A written defense on the map itself ("out of scope because the cache key is unchanged") — not an approval, a memory, or a vibe.' },
      { tag: 'Backend · idempotency', due: 'due · 7-day window', prompt: 'Why derive an idempotency key from intent instead of time?', answer: 'A retry of the same intent must map to the same key. Timestamps make every retry look like a new intent — which is exactly the duplicate charge.' },
      { tag: 'Concept maps · edges', due: 'due · 30-day window', prompt: 'Why is a map with fewer, defended edges worth more than a complete diagram?', answer: 'Because a reviewer trusts what you can defend. Every edge you draw is a claim; undefended completeness is just decoration.' },
    ];
  }

  grade(g) {
    const grades = [...this.state.grades, g];
    if (grades.length >= this.cards().length && window.SageState) window.SageState.set('recallDue', 0);
    this.setState({ grades, idx: this.state.idx + 1, revealed: false });
  }

  renderVals() {
    const cards = this.cards();
    const { idx, revealed, grades } = this.state;
    const inQueue = idx < cards.length;
    const card = inQueue ? cards[idx] : cards[0];
    const goodCount = grades.filter((g) => g === 'good' || g === 'easy').length;

    return {
      dots: cards.map((_, i) => ({
        size: i === idx ? '26px' : '14px',
        color: i < idx ? '#18B663' : i === idx ? '#3D5AFE' : '#26262E',
      })),
      counter: inQueue ? (idx + 1) + ' of ' + cards.length : 'done',

      inQueue,
      done: !inQueue,
      revealed: inQueue && revealed,
      notRevealed: inQueue && !revealed,

      cardTag: card.tag,
      cardDue: card.due,
      cardPrompt: card.prompt,
      cardAnswer: card.answer,

      reveal: () => this.setState({ revealed: true }),
      gradeAgain: () => this.grade('again'),
      gradeHard: () => this.grade('hard'),
      gradeGood: () => this.grade('good'),
      gradeEasy: () => this.grade('easy'),

      summaryLine: goodCount === 4 ? 'All four held.' : goodCount + ' of 4 held; the misses come back sooner.',
      restart: () => this.setState({ idx: 0, revealed: false, grades: [] }),
      noTransfer: !this.state.transfer,
      hasTransfer: !!this.state.transfer,
      transfer: this.state.transfer,
      transferBtnLabel: this.state.transferBusy ? 'Sprout is writing…' : 'Fresh transfer prompt from Sprout',
      getTransfer: () => this.getTransfer(),
    };
  }
}
</script>
